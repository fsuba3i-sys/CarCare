name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub Ubuntu runner already ships the Android SDK (ANDROID_HOME).
      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          {
            echo "== java"; java -version 2>&1
            echo "== ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "$ANDROID_HOME/platforms" 2>&1 | tail -5
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            chmod +x gradlew
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            ./gradlew assembleDebug --no-daemon --stacktrace
          } > build-log.txt 2>&1
          code=$?
          tail -60 build-log.txt
          exit $code

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: CarCare-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish the result (APK on success, log either way) to the "apk" branch
      - name: Publish to apk branch
        if: always()
        run: |
          mkdir -p out
          cp build-log.txt out/ 2>/dev/null || echo "no build log" > out/build-log.txt
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk out/CarCare.apk
            echo success > out/status.txt
          else
            echo failure > out/status.txt
          fi
          echo "${GITHUB_SHA}" >> out/status.txt
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
